name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-validation:
    name: Python lint, tests, and dependency health
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Check dependency health
        run: python -m pip check

      - name: Run Ruff
        run: python -m ruff check src scripts tests

      - name: Run test suite
        run: python -m pytest -p no:cacheprovider

  dbt-parse:
    name: Credential-free dbt parse
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Create credential-free DEV profile
        shell: pwsh
        run: |
          $profileDir = Join-Path $env:RUNNER_TEMP 'dbt-ci-profile'
          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null
          @'
          supplysight:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ci_account
                user: ci_user
                role: SUPPLYSIGHT_DEV_SERVICE
                database: SUPPLY_CHAIN_DEV
                warehouse: SUPPLY_CHAIN_DEV_WH
                schema: STAGING
                threads: 4
                client_session_keep_alive: false
                private_key_path: C:/ci/no-private-key.p8
          '@ | Set-Content -LiteralPath (Join-Path $profileDir 'profiles.yml') -Encoding utf8
          "DBT_PROFILES_DIR=$profileDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Parse dbt project
        run: dbt parse --project-dir dbt --profiles-dir "$env:DBT_PROFILES_DIR" --no-partial-parse

  docker-airflow-validation:
    name: Docker and Airflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --file airflow/docker-compose.yml config --quiet
        env:
          AIRFLOW_FERNET_KEY: ci-only-placeholder
          AIRFLOW_WEBSERVER_SECRET_KEY: ci-only-placeholder
          AIRFLOW_DB_USER: ci_user
          AIRFLOW_DB_PASSWORD: ci_password
          AIRFLOW_ADMIN_PASSWORD: ci_admin_password
          SNOWFLAKE_ACCOUNT: ci_account
          SNOWFLAKE_USER: ci_user
          SNOWFLAKE_ROLE: SUPPLYSIGHT_DEV_SERVICE
          SNOWFLAKE_PRIVATE_KEY_HOST_PATH: /tmp/no-private-key.p8

      - name: Build Airflow image
        run: docker build --file airflow/Dockerfile --tag supplysight-airflow:ci .

      - name: Import Airflow DAGs
        run: >-
          docker run --rm
          --entrypoint /usr/local/bin/python
          --volume "$PWD:/opt/supplysight:ro"
          --env PYTHONPATH=/opt/supplysight/src
          --env AIRFLOW__CORE__DAGS_FOLDER=/opt/supplysight/airflow/dags
          supplysight-airflow:ci -c
          "from airflow.models.dagbag import DagBag; bag = DagBag('/opt/supplysight/airflow/dags', include_examples=False); print(sorted(bag.dag_ids)); assert not bag.import_errors, bag.import_errors; assert {'supplysight_dev_ingestion', 'supplysight_dev_warehouse'} <= set(bag.dag_ids)"

  repository-secrets:
    name: Tracked credential file audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject tracked local credential files
        shell: bash
        run: |
          set -euo pipefail
          unexpected_files="$(git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)[^/]+\.(p8|pem|key)$' | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "$unexpected_files" ]]; then
            printf 'Tracked credential-like files found:\n%s\n' "$unexpected_files" >&2
            exit 1
          fi
          if git grep -n -I -E -e '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'; then
            echo 'A private key block is present in tracked source files.' >&2
            exit 1
          fi
