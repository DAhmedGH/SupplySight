name: dbt DEV validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-dev-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dbt-dev-test:
    name: Read-only dbt compile and tests on DEV
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: supply-chain-dev
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: airflow/requirements.txt

      - name: Install dbt adapter
        run: python -m pip install "dbt-snowflake==1.12.1"

      - name: Validate required environment secrets
        shell: bash
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          for name in SNOWFLAKE_ACCOUNT SNOWFLAKE_USER SNOWFLAKE_ROLE SNOWFLAKE_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required supply-chain-dev environment secret $name is missing." >&2
              exit 1
            fi
          done
          case "$SNOWFLAKE_ROLE" in
            SUPPLYSIGHT_DEV_SERVICE) ;;
            *) echo 'SNOWFLAKE_ROLE must be SUPPLYSIGHT_DEV_SERVICE.' >&2; exit 1 ;;
          esac

      - name: Configure DEV-only dbt profile
        shell: bash
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          profile_dir="$RUNNER_TEMP/dbt-dev-profile"
          mkdir -p "$profile_dir"
          key_file="$profile_dir/snowflake_key.p8"
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          export SNOWFLAKE_PRIVATE_KEY_FILE="$key_file"
          export SNOWFLAKE_DATABASE=SUPPLY_CHAIN_DEV
          export SNOWFLAKE_WAREHOUSE=SUPPLY_CHAIN_DEV_WH
          if [[ "$SNOWFLAKE_DATABASE" != SUPPLY_CHAIN_DEV || "$SNOWFLAKE_WAREHOUSE" != SUPPLY_CHAIN_DEV_WH ]]; then
            echo 'DEV database and warehouse safety check failed.' >&2
            exit 1
          fi
          cat > "$profile_dir/profiles.yml" <<'YAML'
          supplysight:
            target: dev_ci
            outputs:
              dev_ci:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                role: "{{ env_var('SNOWFLAKE_ROLE') }}"
                database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
                warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
                schema: STAGING
                threads: 2
                client_session_keep_alive: false
                private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_FILE') }}"
                private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
          YAML
          echo "DBT_PROFILES_DIR=$profile_dir" >> "$GITHUB_ENV"
          echo "SNOWFLAKE_PRIVATE_KEY_FILE=$key_file" >> "$GITHUB_ENV"
          echo 'SNOWFLAKE_DATABASE=SUPPLY_CHAIN_DEV' >> "$GITHUB_ENV"
          echo 'SNOWFLAKE_WAREHOUSE=SUPPLY_CHAIN_DEV_WH' >> "$GITHUB_ENV"

      - name: Compile dbt project against DEV
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: dbt compile --project-dir dbt --profiles-dir "$DBT_PROFILES_DIR" --no-introspect

      - name: Run dbt tests against DEV
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: dbt test --project-dir dbt --profiles-dir "$DBT_PROFILES_DIR"

      - name: Remove temporary DEV key and profile
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/dbt-dev-profile/snowflake_key.p8" "$RUNNER_TEMP/dbt-dev-profile/profiles.yml"
